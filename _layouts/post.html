---
layout: default
---
<article class="prose h-entry">
  <header class="page-header">
    <p class="eyebrow"><a href="{{ '/notes/' | relative_url }}">Notes</a></p>
    <h1 class="p-name">{{ page.title }}</h1>
    <p class="page-meta">
      <time class="dt-published" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
      {% if page.pathways %}
        <span aria-hidden="true">·</span>
        <span>{{ page.pathways | join: ", " }}</span>
      {% endif %}
    </p>
    {% if page.summary %}<p class="lede p-summary">{{ page.summary }}</p>{% endif %}
  </header>
  <div class="e-content">{{ content }}</div>
</article>
