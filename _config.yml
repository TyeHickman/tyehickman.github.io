title: Tye Hickman
description: Notes, projects, and stories from an engineer, builder, and writer.
url: "https://tyehickman.github.io"

collections:
  projects:
    output: true
    permalink: /projects/:name/
  stories:
    output: true
    permalink: /stories/:name/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  - scope:
      path: ""
      type: "stories"
    values:
      layout: "story"
  - scope:
      path: ""
    values:
      layout: "default"

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
